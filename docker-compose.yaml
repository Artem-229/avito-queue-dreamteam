services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: avito-queue-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: avito_queue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avito_queue"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: ghcr.io/kukymbr/goose-docker:latest
    container_name: avito-queue-migrator
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=postgres port=5432 user=postgres password=postgres dbname=avito_queue sslmode=disable

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avito-queue-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: avito_queue
      # Секрет подписи сессии. Приложение не стартует, если он не задан или
      # короче 32 байт. Для локального запуска значение по умолчанию ниже
      # годится; на публичном стенде задаётся своё через .env.
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-local-development-session-secret-change-me}
      # На локальном http кука Secure не сохранится браузером, на HTTPS-стенде
      # переменную нужно выставить в true.
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
      # Демо-ручки (expire-now, simulate) нужны для показа, поэтому в compose
      # включены. По умолчанию в конфиге они выключены.
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      #ключ для гигачата
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-local-development-admin-secret-change-me}

      
    volumes:
      - ./configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
  
  frontend:
    build:
      context: ./frontend 
      dockerfile: Dockerfile
    container_name: avito-queue-frontend
    restart: unless-stopped
    ports:
      - "3000:80" 
    depends_on:
      - app

volumes:
  postgres_data: