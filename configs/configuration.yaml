# slog levels: -4 debug, 0 info, 4 warn, 8 error
logger:
  level: 0

http_server:
  host: "0.0.0.0"
  port: 8080

auth:
  # session_secret задаётся ТОЛЬКО через AUTH_SESSION_SECRET, здесь его нет
  # намеренно: закоммиченный секрет подписи известен всем, кто открыл репозиторий.
  # Приложение не стартует, если переменная не задана или короче 32 байт.
  secure_cookie: false

demo:
  # Демо-ручки (/demo/expire-now, /demo/simulate) выключены по умолчанию,
  # включаются переменной DEMO_ENABLED на стенде.
  enabled: true

admin:
  # secret_key задаётся ТОЛЬКО через ADMIN_SECRET_KEY, здесь его нет по той же
  # причине, что и session_secret выше. В отличие от session_secret,
  # отсутствие этого ключа НЕ останавливает приложение при старте — админка
  # (POST/PATCH/DELETE /catalog) второстепенна относительно основного
  # пользовательского сценария; без ключа она просто отвечает 503, весь
  # остальной сервис продолжает работать штатно.
  
database:
  host: postgres
  port: 5432
  user: postgres
  password: postgres
  name: avito_queue
  ssl_mode: disable