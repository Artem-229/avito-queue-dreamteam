server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-фолбэк: любой маршрут отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на бэкенд Go.
    # proxy_pass БЕЗ слэша после порта: со слэшем nginx считает его заменой
    # для location и срезает префикс /api/, так что /api/v1/catalog уходит на
    # бэкенд как /v1/catalog — 404 на каждом запросе фронта.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
