name: ci
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  lint:
    name: backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.1

  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    # Тесты доменной логики интеграционные: реальные блокировки строк и
    # реальный констрейнт, поэтому в CI поднимается настоящий Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: avito_queue
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avito_queue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./cmd/... ./internal/...

      - name: Apply migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.24.1 -dir ./migrations postgres "$GOOSE_DBSTRING" up
        env:
          GOOSE_DBSTRING: host=localhost port=5432 user=postgres password=postgres dbname=avito_queue sslmode=disable

      - name: Run tests with race detector
        run: go test -race -count=1 ./internal/...
        env:
          TEST_DATABASE_DSN: postgres://postgres:postgres@localhost:5432/avito_queue?sslmode=disable

  frontend-checks:
    name: frontend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
